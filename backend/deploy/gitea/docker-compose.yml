# Local Gitea (spec-0002/T1; spec-0032/T6 adds Actions + runner): sqlite, minimal operational surface.
# Fixed ports (T2/T3 depend on stable URLs; random ports are forbidden). Data is persisted in a named volume.
services:
  gitea:
    image: gitea/gitea:1.22
    container_name: ahe-beta-gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=http://localhost:3000/
      - GITEA__server__HTTP_PORT=3000
      # Skip the web install page: the env pre-configures the database with installation locked, so the API is immediately usable (otherwise /api/v1 keeps returning 404).
      - GITEA__security__INSTALL_LOCK=true
      # Single instance for personal use: registration and email verification disabled, reducing initialization friction.
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      # Spec-0032/T6: enable Gitea Actions — carries the minimal smoke CI for the harness repo (vigil's ci gate reads the commit status).
      - GITEA__actions__ENABLED=true
    volumes:
      - gitea_data:/data
    networks:
      - ci
      # Spec-0033/T1: also attach the delivery-plane internal network — the vigil container reaches gitea:3000 directly via vigil-net
      # (issue/push/merge); the host port mapping still goes through the ci network as before and is unaffected by internal.
      - vigil_net
    ports:
      - "127.0.0.1:3000:3000"   # HTTP (fixed)
      - "127.0.0.1:2222:22"     # SSH (optional)

  # Spec-0032/T6: Actions runner. The registration token is generated by bootstrap.sh and written into RUNNER_TOKEN in the .env in this directory
  # (compose automatically reads the .env in the same directory for interpolation); after the first registration the credentials land in the runner_data volume, so restarts require no re-registration.
  # Empirically verified fix: ubuntu-latest maps to catthehacker/ubuntu:act-latest, the standard image in Gitea's official docs (~1GB, bundles
  # node+git+python3) — the earlier python:3.12-bookworm had no node, so actions/checkout@v4 (a Node action)
  # failed at the very first step with exec node not found and the smoke test stayed red. **Note**: labels are baked into the runner credentials at registration time; after changing labels,
  # you must `docker volume rm gitea_runner_data` (or down -v) and re-register for them to take effect.
  act-runner:
    image: gitea/act_runner:0.2.11
    container_name: ahe-beta-act-runner
    restart: unless-stopped
    depends_on:
      - gitea
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${RUNNER_TOKEN:-}
      - GITEA_RUNNER_NAME=ahe-beta-runner
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker://catthehacker/ubuntu:act-latest
      - CONFIG_FILE=/runner-config.yaml
    volumes:
      - runner_data:/data
      # Follow-up empirical fix: the job container is started by the runner via the host docker and is **not on this compose network by default** — inside the container,
      # the `gitea` hostname cannot be resolved, and checkout/clone would fail at the next step. runner-config.yaml pins the job container into
      # the named network below (ahe-beta-ci).
      - ./runner-config.yaml:/runner-config.yaml:ro
      # The job container is started by the runner on the host docker (the standard approach other than docker-in-docker).
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ci

  # Spec-0033/T1: delivery-plane egress proxy — the vigil container's only channel to the outside network (allowlist in egress-proxy.conf,
  # only Anthropic API domains are allowed). Dual networks: vigil-net faces vigil; the ci network provides external access (NAT).
  # Pin the image tag to a specific version once verified in production (same pinning discipline as gitea/act_runner).
  egress-proxy:
    image: ubuntu/squid:latest
    container_name: ahe-beta-egress-proxy
    restart: unless-stopped
    volumes:
      # Explicit opt-in: AHE_BETA_EGRESS_CONFIG=./egress-gitea-com.conf
      - ${AHE_BETA_EGRESS_CONFIG:-./egress-proxy.conf}:/etc/squid/squid.conf:ro
      - ./egress-proxy.conf:/etc/squid/egress-base.conf:ro
    networks:
      - ci
      - vigil_net

networks:
  # Explicitly named (does not take the compose project-name prefix): container.network in runner-config.yaml must reference it by name.
  ci:
    name: ahe-beta-ci
  # Spec-0033/T1: delivery-plane internal network — no NAT, so the vigil container physically cannot reach the outside network directly (its only egress is egress-proxy);
  # run.py attaches the vigil container by name (ahe-beta-vigil-net) when starting it.
  vigil_net:
    name: ahe-beta-vigil-net
    internal: true

volumes:
  gitea_data:
  runner_data:
