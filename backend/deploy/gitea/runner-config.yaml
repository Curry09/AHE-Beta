# Spec-0032/T6 (follow-up empirical fix): act_runner config — declare only the items that must deviate from the defaults.
# The job container must be attached to the compose named network (ahe-beta-ci); otherwise the container cannot resolve the `gitea` hostname.
# actions/checkout / git clone fails at the code-pulling step (the host localhost:3000 is also unreachable from within the container).
container:
  network: ahe-beta-ci
