# Spec-0033/T1：交付面出口代理 allowlist（squid）。vigil 容器唯一的外网通道——挂 internal 网络的
# vigil 直连外网物理不通，HTTPS 出流量必须经本代理，且只放行下列域（0022「网络出口 allowlist」落地）。
# 自定义 ANTHROPIC_BASE_URL（自建网关）时，把网关域名加进 allowed_egress 并重启 egress-proxy。
http_port 3128

acl allowed_egress dstdomain .anthropic.com
acl allowed_egress dstdomain .claude.ai

# CONNECT 只放行 443（HTTPS 隧道），其余端口拒。
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports

http_access allow allowed_egress
http_access deny all

# 无缓存：这是围堵闸不是加速器。
cache deny all
# 日志落容器内文件（查看：docker exec auto-designer-egress-proxy tail -f /var/log/squid/access.log）。
# 生产实证：不能写 stdio:/dev/stdout——squid 启动后降权到 proxy 用户，打不开 root 持有的
# /dev/stdout 会崩溃循环；也不用 cache_effective_user root 换 docker-logs 便利（本代理直面被
# 围堵 agent 的流量，保持降权优先）。审计进 docker logs 属 Future（log helper/sidecar 另议）。
access_log stdio:/var/log/squid/access.log
