# Spec-0047/T3：每实验独立 egress allowlist（不含密钥、不含宿主 cache_peer）。
http_port 3128

acl allowed_egress dstdomain .anthropic.com
acl allowed_egress dstdomain .claude.ai
# WIS Anthropic/OpenAI-compatible gateway used by the configured delivery model.
acl allowed_egress dstdomain .paperbypass.com
# 本机 GLM OpenAI/Anthropic 兼容端点；只允许该固定地址。
acl local_glm dst 172.22.64.1/32

acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow allowed_egress
http_access allow local_glm
http_access deny all
cache deny all
access_log stdio:/var/log/squid/access.log
