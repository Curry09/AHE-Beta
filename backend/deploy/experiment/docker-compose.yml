# Spec-0069/T3: only infrastructure; the controller owns Vigil.
# Spec-0047/T3：每实验 Compose 模板。禁止 container_name / 全局网络名 / 共享 named volume。
# 首次 GITEA_HOST_PORT=0 由 Docker 分配；之后保持已记录的端口。凭证不进本文件。
# Spec-0077/T2: render_stack conditionally adds the owned runner and enables Actions.
services:
  gitea:
    image: ${GITEA_IMAGE:-gitea/gitea:1.22}
    restart: unless-stopped
    labels:
      io.openagents.experiment_id: "${EXPERIMENT_ID}"
      io.openagents.manifest_sha: "${MANIFEST_SHA}"
      io.openagents.role: gitea
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__HTTP_PORT: "3000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "false"
      GITEA__attachment__ALLOWED_TYPES: "*/*"
      GITEA__attachment__MAX_SIZE: "100"
    volumes:
      - gitea_data:/data
    networks:
      - ci
      - vigil_net
    ports:
      - "127.0.0.1:${GITEA_HOST_PORT:-0}:3000"

  egress-proxy:
    image: ${EGRESS_IMAGE:-ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029}
    restart: unless-stopped
    labels:
      io.openagents.experiment_id: "${EXPERIMENT_ID}"
      io.openagents.manifest_sha: "${MANIFEST_SHA}"
      io.openagents.role: egress
    volumes:
      # Explicit opt-in: AHE_BETA_EGRESS_CONFIG=./egress-gitea-com.conf
      - ${AHE_BETA_EGRESS_CONFIG:-./egress-proxy.conf}:/etc/squid/squid.conf:ro
      - ./egress-proxy.conf:/etc/squid/egress-base.conf:ro
    networks:
      - ci
      - vigil_net


networks:
  ci:
    labels: &ownership
      io.openagents.experiment_id: "${EXPERIMENT_ID}"
      io.openagents.manifest_sha: "${MANIFEST_SHA}"
  vigil_net:
    internal: true
    labels: *ownership

volumes:
  gitea_data:
    labels: *ownership
