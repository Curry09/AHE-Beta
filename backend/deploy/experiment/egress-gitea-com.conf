# Spec-0070/T4: opt-in hosted observation transport. No change to default egress.
# These ACLs inspect the destination hostname, never the URL path or query.
# -n prevents reverse DNS from turning an IP literal into an allowed hostname.
acl evidence_connect method CONNECT
acl evidence_tls_port port 443
acl evidence_gitea dstdomain -n gitea.com
acl evidence_r2 dstdom_regex -n ^[a-f0-9]{32}\.r2\.cloudflarestorage\.com$
http_access allow evidence_connect evidence_tls_port evidence_gitea
http_access allow evidence_connect evidence_tls_port evidence_r2

# Keep the deployment's existing model gateways, upstream proxy, and final deny.
include /etc/squid/egress-base.conf
