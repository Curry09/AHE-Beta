# Process startup declaration. `entry` is the argv list used to start the assistant.
# Optional cwd is relative to this directory; optional env adds environment variables.
entry:
  - python3
  - entry.py
# The process exchanges one typed JSON object per line.
protocol: stdio-jsonl-v1
observations: artifact-observations-v1
# cwd: .
# env:
