# harness v0 的 nexau agent 定义：最简「只有 bash」的工具型 agent，结构对齐 developer_agent。
# 被进化对象起点——开发者 agent 后续会改本文件与 agents/main.md（甚至演化为多 agent）。
type: agent
name: harness
max_context_tokens: 128000
system_prompt: ./agents/main.md
system_prompt_type: string
# structured：模型以 XML 输出工具调用、由 nexau 解析，不依赖原生 function calling（任何 chat 模型可用）。
tool_call_mode: structured
max_iterations: 30

llm_config:
  model: ${env.LLM_MODEL}
  base_url: ${env.LLM_BASE_URL}
  api_key: ${env.LLM_API_KEY}
  # Nex-N2-Pro 是推理模型：reasoning_content 先吃 token，4096 会被推理吃光致 content=null。
  max_tokens: 32768
  timeout: 300
  api_type: openai_chat_completion

# 本地 sandbox：run_shell_command 在 work_dir 执行；work_dir 取环境变量 SANDBOX_WORK_DIR
# （entry.py 运行时指向一个干净的每会话工作区，作为「用户项目」根目录）。
sandbox_config:
  type: local

# 只挂 bash（run_shell_command）+ complete_task：bash 即可读写文件、跑校验，最小够用。
tools:
  - name: run_shell_command
    yaml_path: ./tools/run_shell_command.tool.yaml
    binding: nexau.archs.tool.builtin.shell_tools:run_shell_command
  - name: complete_task
    yaml_path: ./tools/complete_task.tool.yaml
    binding: nexau.archs.tool.builtin.session_tools:complete_task

stop_tools: [complete_task]
