# Spec-0032/T6 + 0040/T3：harness 仓最小冒烟 CI——交付面 PR 门禁的工程质量闸（绝不跑 benchmark / 不调 LLM）。
# 只验「harness 结构没被改崩」：全仓可编译 + 关键制品在位。跑在 deploy/gitea 的 act_runner 上
# （ubuntu-latest → python:3.12 容器，纯标准库，零外部依赖安装）。
name: smoke
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 结构冒烟（编译 + 制品在位）
        # 实证修复：用 python3（runner 镜像 catthehacker/ubuntu:act-latest 的 python 入口名）。
        run: |
          python3 -m compileall -q .
          test -f entry.py
          test -f params.yaml
          test -d agents
          echo "smoke ok"
      - name: 边界检查（服务端硬化——pre-commit 可被 --no-verify 绕，此处绕不开）
        run: |
          python3 - <<'EOF'
          # Spec-0040/T3：拒绝清单与 AHE-Beta 的 dev/harness_boundary.py 同源（仓独立、无法 import，改动须两处同步）。
          # 容器围堵后不再用顶层白名单：docs/specs、新目录、pyproject 都是合法演进；只拦密钥和 vigil 运行态。
          import os
          import sys

          denied_top = {".openagents"}
          ignorable = {".git", "__pycache__"}
          bad = []
          for name in os.listdir("."):
              if name in ignorable:
                  continue
              if name in denied_top:
                  bad.append(name)
                  continue
              if name == ".env.example":
                  continue
              if name == ".env" or name.startswith(".env."):
                  bad.append(name)
          if bad:
              print("[boundary] 拒绝入库（密钥 / vigil 运行态）：", sorted(bad))
              sys.exit(1)
          print("boundary ok")
          EOF
