# Spec-0032/T6 + 0040/T3: minimal harness repo smoke CI, the engineering quality gate for delivery-side PRs (never runs benchmark / calls an LLM).
# Check only that harness structure remains intact: the whole repo compiles and key artifacts exist. Runs on deploy/gitea act_runner
# (ubuntu-latest -> python:3.12 container, standard library only, no external dependency installation).
name: smoke
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structure smoke test (compilation + artifacts present)
        # Empirical fix: use python3 (the Python entry point in the runner image catthehacker/ubuntu:act-latest).
        run: |
          python3 -m compileall -q .
          test -f entry.py
          test -f params.yaml
          test -d agents
          echo "smoke ok"
      - name: Boundary check (server hardening; --no-verify cannot bypass this check)
        run: |
          python3 - <<'EOF'
          # Spec-0040/T3: the denylist shares its source with AHE-Beta dev/harness_boundary.py (independent repo, cannot import; update both copies together).
          # Container isolation removes the top-level allowlist: docs/specs, new directories, and pyproject are legitimate evolution; block only secrets and vigil runtime state.
          import os
          import sys

          denied_top = {".openagents"}
          ignorable = {".git", "__pycache__"}
          bad = []
          for name in os.listdir("."):
              if name in ignorable:
                  continue
              if name in denied_top:
                  bad.append(name)
                  continue
              if name == ".env.example":
                  continue
              if name == ".env" or name.startswith(".env."):
                  bad.append(name)
          if bad:
              print("[boundary] Refusing repository content (secrets / vigil runtime state):", sorted(bad))
              sys.exit(1)
          print("boundary ok")
          EOF
