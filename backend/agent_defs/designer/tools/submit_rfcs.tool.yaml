type: tool
name: submit_rfcs
description: >-
  Submit structural proposals and finish. Call this compatibility-named tool
  exactly once after reviewing ProposalView, experience trends, and runtime data.

  Pass `proposals`: 0..n cross-proposal syntheses. Each item names at least two
  source proposals and explains their relationship, common tension, structural
  direction, and expected leverage. Optionally
  provide `covers` as merge recommendations for Owner. This call does not admit,
  merge, close, or otherwise transition existing proposals.

  The parameters are schema-validated at call time; invalid values (missing field,
  self-invented keys) are rejected and you must retry.
# Spec-0043: generated from agent_contract.synthesis_input_schema().
input_schema:
  type: object
  properties:
    proposals:
      type: array
      items:
        type: object
        properties:
          title:
            type: string
          source_proposals:
            type: array
            items:
              type: integer
          relationship:
            type: string
          common_tension:
            type: string
          structural_direction:
            type: string
          expected_leverage:
            type: string
          covers:
            type: array
            items:
              type: integer
          solution_level:
            type: string
            enum: [structural_mechanism, implementation_design]
          abstraction_rationale:
            type: string
        required:
          - title
          - source_proposals
          - relationship
          - common_tension
          - structural_direction
          - expected_leverage
          - solution_level
          - abstraction_rationale
        additionalProperties: false
  required:
    - proposals
  additionalProperties: false
