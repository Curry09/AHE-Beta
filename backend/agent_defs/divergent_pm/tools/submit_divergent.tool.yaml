type: tool
name: submit_divergent
description: >-
  Submit capability-discovery proposals and finish. Call this tool exactly once
  after reviewing the available experience evidence.

  Pass `proposals`: 0..n product insights. Each item separates the user goal,
  observed behaviours, experience tension, product opportunity, desired outcome,
  and evidence sessions. Existing proposals are context, not a novelty gate;
  Owner decides whether they enter the ready queue.

  The parameters are schema-validated at call time; invalid values (missing field,
  self-invented keys) are rejected and you must retry.
# Spec-0043: generated from agent_contract.pm_input_schema().
input_schema:
  type: object
  properties:
    proposals:
      type: array
      items:
        type: object
        properties:
          title:
            type: string
          user_goal:
            type: string
          observed_behaviors:
            type: array
            items:
              type: string
          experience_tension:
            type: string
          product_opportunity:
            type: string
          desired_outcome:
            type: string
          evidence_sessions:
            type: array
            items:
              type: string
          related_proposals:
            type: array
            items:
              type: integer
          solution_level:
            type: string
            enum: [product_capability, implementation_design]
          abstraction_rationale:
            type: string
        required:
          - title
          - user_goal
          - observed_behaviors
          - experience_tension
          - product_opportunity
          - desired_outcome
          - evidence_sessions
          - solution_level
          - abstraction_rationale
        additionalProperties: false
  required:
    - proposals
  additionalProperties: false
