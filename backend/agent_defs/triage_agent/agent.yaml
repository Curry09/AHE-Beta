type: agent
name: triage_agent
max_context_tokens: 256000
system_prompt: ./systemprompt.md
system_prompt_type: file
# structured: use native structured model tool calls; NexAU validates tool arguments against the schema.
tool_call_mode: structured
# The budget covers progressive evidence collection for one report and retries after submit schema validation failures;
# the executor returns schema errors to the next turn for correction; max_iterations bounds all retries.
max_iterations: 30

middlewares:
  # Workspace jail: triage can read only its own harness repo; file tools reject all reads outside it, mechanically blocking trace access
  # (data/sessions user experience scores and sessions, data/harness_runs runtime copies). Reading a task trace line by line pulls task-specific artifacts
  # into conclusions, causing overfitting. The general jail also blocks every outside path (data/live, etc.), beyond named trace paths.
  - import: ahe_beta.guards.workspace_jail:WorkspaceJailMiddleware

llm_config:
  # Role configuration: triage shares DEMAND_LLM_* with architect (architect).
  model: ${env.DEMAND_LLM_MODEL}
  base_url: ${env.DEMAND_LLM_BASE_URL}
  api_key: ${env.DEMAND_LLM_API_KEY}
  max_tokens: 32768
  timeout: 300
  api_type: openai_chat_completion

# Local sandbox: read-only harness repo (the shared runtime binds each call to a source snapshot of the trial SHA) grounds the current state;
# triage changes no files or git state, using read_file / list_directory / search_file_content for evidence and
# get_session_timeline for a single-session trace, plus submit_triage for the disposition (native structured stop tool).
sandbox_config:
  type: local

tools:
  - name: submit_observation_gap
    yaml_path: ./tools/submit_observation_gap.tool.yaml
    binding: ahe_beta.observations.gaps:submit_observation_gap
  - name: read_file
    yaml_path: ./tools/read_file.tool.yaml
    binding: nexau.archs.tool.builtin.file_tools:read_file
  - name: list_directory
    yaml_path: ./tools/list_directory.tool.yaml
    binding: nexau.archs.tool.builtin.file_tools:list_directory
  # Locate relevant content without a shell, then read the necessary excerpts on demand.
  - name: search_file_content
    yaml_path: ./tools/search_file_content.tool.yaml
    binding: nexau.archs.tool.builtin.file_tools:search_file_content
  # Fetch the persisted god-view usage event timeline for one user simulation on demand (including its feeling score); the orchestration side reads SessionStore,
  # while the jail still blocks direct reads of sessions/. If the timeline is too coarse, drill down with beat/step below (spec-0024 T4/T5)
  # to avoid filling the context with the entire bundle at once.
  - name: get_session_timeline
    yaml_path: ./tools/get_session_timeline.tool.yaml
    binding: ahe_beta.demand.session_timeline:get_session_timeline
  # Drill into a beat: truncated harness internal tool sequence and stop_kind; use when the timeline lacks detail.
  - name: get_harness_beat
    yaml_path: ./tools/get_harness_beat.tool.yaml
    binding: ahe_beta.demand.session_timeline:get_harness_beat
  # Expand one step body further (hard character limit); call only when the beat has truncated=true and more detail is necessary.
  - name: get_harness_step
    yaml_path: ./tools/get_harness_step.tool.yaml
    binding: ahe_beta.demand.session_timeline:get_harness_step
  # Spec-0027/T2: finish with submit_triage (native structured stop tool). input_schema is generated by issue_schema;
  # nexau validates at the call layer (drifted fields/invalid enums are rejected for retry); the binding echoes arguments as the agent.run result,
  # which the driver reads directly. Replaces the old complete_task, second LLM restructuring pass, and alias normalization.
  - name: submit_triage
    yaml_path: ./tools/submit_triage.tool.yaml
    binding: ahe_beta.demand.submit_tools:submit_triage

stop_tools: [submit_triage]
