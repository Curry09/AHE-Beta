type: agent
name: triage_agent
max_context_tokens: 128000
system_prompt: ./systemprompt.md
system_prompt_type: string
# xml 模式：模型以 XML 输出工具调用，nexau 解析；不依赖模型原生 function calling，任何 chat 模型可用。
tool_call_mode: structured
# 30：读 harness 码（两三次）+ 判重 + 收尾本该远够用；给足余量让每条 disposition 都能干净走到
# submit_triage。⚠️ Spec-0027：input_schema 校验失败会回灌重试（executor 组 is_error→下一轮重来），
# 重试上限即此 max_iterations（无专门计数器），故给足余量、别掐死重试。
max_iterations: 30

middlewares:
  # 工作区 jail：triage 只能读自己的 harness 仓，文件工具越界读一律拒——机制硬禁读 trace
  # （data/sessions 体感+会话、data/harness_runs 运行副本）。逐行看某任务轨迹会把该任务专属产物
  # 带进结论 = 过拟合的源头。通用 jail 一并挡住仓外任何路径（data/live 等），不止点名 trace。
  - import: auto_designer.dev.workspace_jail:WorkspaceJailMiddleware

llm_config:
  # 分角色配置：triage 与 synthesize（designer）共用 DESIGNER_LLM_*。
  model: ${env.DESIGNER_LLM_MODEL}
  base_url: ${env.DESIGNER_LLM_BASE_URL}
  api_key: ${env.DESIGNER_LLM_API_KEY}
  max_tokens: 32768
  timeout: 300
  api_type: openai_chat_completion

# 本地 sandbox：只读 harness 仓（SANDBOX_WORK_DIR 指向 harness 仓）用于读现状 grounding；
# triage 不改文件、不碰 git，仅 read_file / list_directory / search_file_content 取证 +
# get_session_timeline 拉单局轨迹 + submit_triage 交 disposition（原生结构化 stop tool）。
sandbox_config:
  type: local

tools:
  - name: read_file
    yaml_path: ./tools/read_file.tool.yaml
    binding: nexau.archs.tool.builtin.file_tools:read_file
  - name: list_directory
    yaml_path: ./tools/list_directory.tool.yaml
    binding: nexau.archs.tool.builtin.file_tools:list_directory
  # grep：triage 无 shell，靠它「先搜后读」——按关键词跳到相关函数再精读那一段，
  # 别把 entry.py 等大文件整篇通读烧 iteration。
  - name: search_file_content
    yaml_path: ./tools/search_file_content.tool.yaml
    binding: nexau.archs.tool.builtin.file_tools:search_file_content
  # 按需取一局用户模拟落盘的 god-view 使用事件时间线（含那局体感分）；编排侧读 SessionStore，
  # jail 仍禁直接读 sessions/。时间线太粗时用下面 beat/step 逐层下钻（spec-0024 T4/T5），
  # 避免一次拉整包撑爆上下文。
  - name: get_session_timeline
    yaml_path: ./tools/get_session_timeline.tool.yaml
    binding: auto_designer.designer.session_timeline:get_session_timeline
  # 下钻某一拍：harness 内层 tool 序列（截断）+ stop_kind；timeline 不够细时再用。
  - name: get_harness_beat
    yaml_path: ./tools/get_harness_beat.tool.yaml
    binding: auto_designer.designer.session_timeline:get_harness_beat
  # 再展开某一步正文（硬顶字符）；beat 里 truncated=true 且确需细看时才调。
  - name: get_harness_step
    yaml_path: ./tools/get_harness_step.tool.yaml
    binding: auto_designer.designer.session_timeline:get_harness_step
  # Spec-0027/T2：收尾 = submit_triage（原生结构化 stop tool）。input_schema 由 issue_schema 生成、
  # nexau 在调用层强校验（漂移字段/非法 enum 吐不出 → 重试）；binding 回显参数成为 agent.run 返回，
  # driver 直接读。取代旧 complete_task + 第二次 LLM 重排 + 别名归一。
  - name: submit_triage
    yaml_path: ./tools/submit_triage.tool.yaml
    binding: auto_designer.designer.submit_tools:submit_triage

stop_tools: [submit_triage]
