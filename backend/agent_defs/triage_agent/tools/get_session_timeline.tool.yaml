type: tool
name: get_session_timeline
description: >-
  Fetch a use-event timeline for one user-sim session: what the user saw
  (activity), thought (notes / free intent), did (action + message), heard
  (harness reply), plus rare god-view labels (process_read, capability_gap when
  intent≠action, private_check, silent_stop). Not a raw LLM dump; no system/user
  prompts. Prefer issue_number for the issue you are triaging; use session_id if
  you have it. Do not read sessions/ files yourself. When one beat is too coarse
  to attribute a failure (a stall/timeout), drill in with get_harness_beat.

input_schema:
  type: object
  properties:
    issue_number:
      type: integer
      description: >-
        An open or closed issue number used to locate the session that filed it.
    session_id:
      type: string
      description: >-
        Session id from the feeling curve line ([session=...]). If both are set,
        session_id wins.
    reason:
      type: string
      description: >-
        Short evidence gap this lookup is intended to resolve. Access is recorded;
        an omitted reason is recorded as unspecified.
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
