type: tool
name: submit_triage
description: >-
  Submit the disposition for the single isolated report and finish. Call this
  tool exactly once after completing the evidence review.

  Pass `dispositions` with exactly one item. It needs `issue` (the report number)
  and `disposition` (one of accept / reject / needs_info), with its factual
  `artifact` nested in that same item. `dispositions` must be a native JSON
  array, never a string containing JSON or comma-separated values. Do not
  split the artifact and disposition into separate array items. A maxItems /
  "is too long" validation error refers to the item count; fix the argument
  structure rather than repeatedly shortening the evidence text:
  - accept: also give `kind` (bug/feature/chore/document), `priority` (P0-P3,
    a suggestion), `proposal_title` (a task-independent harness problem title),
    `fields` (the kind's normalized fields, Chinese labels), and the factual
    `artifact` required by the schema.
  - reject / needs_info: also give `reason`.

  The parameters are schema-validated at call time; invalid values (unknown
  field, non-P0-P3 priority, self-invented keys) are rejected and you must retry.
# Spec-0029/T3：input_schema 是 agent_contract.dispositions_input_schema() 的生成副本（受 drift-guard
# 测试守护：test_triage.py::test_submit_triage_yaml_matches_contract 断言二者深度相等）。三值
# disposition（duplicate 退役、跨提案吸收归 Architect）。改字段改 SCHEMAS 后需重新生成此块，否则测试会红。
input_schema:
  type: object
  properties:
    dispositions:
      type: array
      minItems: 1
      maxItems: 1
      items:
        type: object
        properties:
          issue:
            type: integer
          disposition:
            type: string
            enum:
              - accept
              - reject
              - needs_info
          kind:
            type: string
            enum:
              - bug
              - feature
              - chore
              - document
          priority:
            type: string
            enum:
              - P0
              - P1
              - P2
              - P3
          proposal_title:
            type: string
          fields:
            type: object
            properties:
              根因区域:
                type: string
              边界:
                type: string
              验收:
                type: string
              交付物:
                type: string
            additionalProperties: false
          reason:
            type: string
          artifact:
            type: object
            properties:
              reported_problem: {type: string}
              user_impact: {type: string}
              scope_boundary: {type: string}
              evidence: {type: array, items: {type: string}}
              uncertainties: {type: array, items: {type: string}}
              implementation_target:
                type: string
                enum: [harness, outside_harness, uncertain]
            required: [reported_problem, user_impact, scope_boundary, evidence, uncertainties, implementation_target]
            additionalProperties: false
        required:
          - issue
          - disposition
          - artifact
        additionalProperties: false
  required:
    - dispositions
  additionalProperties: false
