type: tool
name: submit_triage
description: >-
  Submit the disposition for the single isolated report and finish. Call this
  tool exactly once after completing the evidence review.

  Pass `dispositions` with exactly one item. It needs `issue` (the report number)
  and `disposition` (one of accept / reject / needs_info), with its factual
  `artifact` nested in that same item. `dispositions` must be a native JSON
  array, never a string containing JSON or comma-separated values. Do not
  split the artifact and disposition into separate array items. A maxItems /
  "is too long" validation error refers to the item count; fix the argument
  structure rather than repeatedly shortening the evidence text:
  - accept: also give `kind` (bug/feature/chore/document), `priority` (P0-P3,
    a suggestion), `proposal_title` (a task-independent harness problem title),
    `fields` (the kind's canonical English machine keys), and the factual
    `artifact` required by the schema.
  - reject / needs_info: also give `reason`.

  The parameters are schema-validated at call time; invalid values (unknown
  field, non-P0-P3 priority, self-invented keys) are rejected and you must retry.
# Spec-0029/T3: input_schema is a generated copy of agent_contract.dispositions_input_schema() (protected by drift-guard
# tests: test_triage.py::test_submit_triage_yaml_matches_contract asserts deep equality). Three-valued
# disposition (duplicate is retired; Architect handles cross-proposal absorption). Regenerate this block after changing fields in SCHEMAS or tests will fail.
input_schema:
  type: object
  properties:
    dispositions:
      type: array
      minItems: 1
      maxItems: 1
      items:
        type: object
        properties:
          issue:
            type: integer
          disposition:
            type: string
            enum:
              - accept
              - reject
              - needs_info
          kind:
            type: string
            enum:
              - bug
              - feature
              - chore
              - document
          priority:
            type: string
            enum:
              - P0
              - P1
              - P2
              - P3
          proposal_title:
            type: string
          fields:
            type: object
            properties:
              root_cause:
                type: string
              boundary:
                type: string
              acceptance:
                type: string
              deliverable:
                type: string
            additionalProperties: false
          reason:
            type: string
          artifact:
            type: object
            properties:
              reported_problem:
                type: string
              user_impact:
                type: string
              scope_boundary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              uncertainties:
                type: array
                items:
                  type: string
              implementation_target:
                type: string
                enum:
                  - harness
                  - outside_harness
                  - uncertain
            required:
              - reported_problem
              - user_impact
              - scope_boundary
              - evidence
              - uncertainties
              - implementation_target
            additionalProperties: false
        required:
          - issue
          - disposition
          - artifact
        additionalProperties: false
  required:
    - dispositions
  additionalProperties: false
