type: agent
name: developer_agent
max_context_tokens: 128000
system_prompt: ./systemprompt.md
system_prompt_type: string
# xml 模式：模型以 XML 输出工具调用，nexau 解析；不依赖模型原生 function calling，任何 chat 模型可用。
tool_call_mode: structured
# 迭代上限 34：既让"迭代预算"先于 _DEV_TIMEOUT(900s 墙钟) 触顶走中间件优雅收尾，又给足余量让
# dev 干完 git（commit/tag/push）后还能调 complete_task 写报告——26 太紧（实测干完活正好被掐、报告只剩
# [Max iteration]）。膨胀已被最小改动纪律摁住（entry.py 稳在 ~270 行），放宽到 34 安全。
max_iterations: 34

# 预算到点→逼收尾：临近 max_iterations 时注入"还剩 N 轮，别再开新工具调用，给结论性回复/总结"。
# 把过去"墙钟硬砍、无产出"换成"优雅收尾"（要么把手头改动验证+提交，要么总结剩余作 follow-up）。
middlewares:
  - import: nexau.archs.main_sub.execution.middleware.round_and_token_reminder:RoundAndTokenReminderMiddleware
    params:
      max_context_tokens: 128000
      desired_max_tokens: 16384
  # 机制保证"尽早落一个已提交增量"：预算过 1/4 或未提交改动过大却还没 commit 时主动施压；
  # 到最后 ~3 轮仍零提交则升级为"硬落地"指令，逼它停止探索、下一步就提交——治"软提示被无视、
  # 空转到 max_iterations 零提交白跑"（实测 round5 dev-0）。仍不替模型写/提交未验证代码。
  - import: auto_designer.dev.commit_checkpoint:CommitCheckpointMiddleware
    params:
      first_commit_by_frac: 0.25
      big_diff_lines: 150
      hard_commit_by_remaining: 3
  # 收尾闸门：complete_task 前强制"完整提交（工作区干净 + 改了可观察行为要同步提交 MANUAL.md）"，
  # 并软性提醒把自验冒烟落库成回归测试；预算紧自动让路，不为它耗到超时。
  - import: auto_designer.dev.completion_gate:CompletionGateMiddleware
    params:
      observable_paths: ["entry.py"]
      manual_path: MANUAL.md

llm_config:
  # 分角色配置：开发者 agent 用 DEV_LLM_*（run.py 未单独设置时已回落公共 LLM_*）。
  model: ${env.DEV_LLM_MODEL}
  base_url: ${env.DEV_LLM_BASE_URL}
  api_key: ${env.DEV_LLM_API_KEY}
  max_tokens: 32768
  timeout: 300
  api_type: openai_chat_completion

# 本地 sandbox：run_shell_command 在 work_dir 执行；work_dir 取环境变量 SANDBOX_WORK_DIR（运行时指向 harness 仓）。
sandbox_config:
  type: local

tools:
  - name: run_shell_command
    yaml_path: ./tools/run_shell_command.tool.yaml
    binding: nexau.archs.tool.builtin.shell_tools:run_shell_command
  - name: read_file
    yaml_path: ./tools/read_file.tool.yaml
    binding: nexau.archs.tool.builtin.file_tools:read_file
  - name: write_file
    yaml_path: ./tools/write_file.tool.yaml
    binding: nexau.archs.tool.builtin.file_tools:write_file
  - name: replace
    yaml_path: ./tools/replace.tool.yaml
    binding: nexau.archs.tool.builtin.file_tools:replace
  - name: list_directory
    yaml_path: ./tools/list_directory.tool.yaml
    binding: nexau.archs.tool.builtin.file_tools:list_directory
  - name: complete_task
    yaml_path: ./tools/complete_task.tool.yaml
    binding: nexau.archs.tool.builtin.session_tools:complete_task

stop_tools: [complete_task]
