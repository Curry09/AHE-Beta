type: tool
name: submit_admission
description: >-
  Submit OpenAgents handoff packages for the current proposal batch and finish.
  Each item needs a routing action plus a handoff summary, preserved capabilities,
  and independent acceptance groups. Admit is the default. Merge is only for exact
  duplicates; hold must name a missing handoff input. Omitted proposals are still
  handed off by the driver.

  The parameters are schema-validated at call time; invalid values (unknown
  decision, self-invented keys) are rejected and you must retry.
# Spec-0029/T6：input_schema 是 agent_contract.admission_input_schema() 的生成副本（受 drift-guard
# 测试守护：test_owner.py 断言二者深度相等）。改契约改 agent_contract 后需重生成此块。
input_schema:
  type: object
  properties:
    decisions:
      type: array
      items:
        type: object
        properties:
          issue:
            type: integer
          decision:
            type: string
            enum:
              - admit
              - merge
              - hold
          into:
            type: integer
          priority:
            type: string
            enum:
              - P0
              - P1
              - P2
              - P3
          reason:
            type: string
          handoff_summary:
            type: string
          preserved_capabilities:
            type: array
            items:
              type: string
          acceptance_groups:
            type: array
            items:
              type: string
        required:
          - issue
          - decision
          - handoff_summary
          - preserved_capabilities
          - acceptance_groups
        additionalProperties: false
  required:
    - decisions
  additionalProperties: false
