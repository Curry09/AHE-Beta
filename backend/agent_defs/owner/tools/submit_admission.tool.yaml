type: tool
name: submit_admission
description: >-
  Submit the admission decisions for the current review batch and finish. Call
  this tool exactly once after completing the portfolio assessment.

  Pass `decisions`: zero or one item per proposal. Each item needs `issue`, one
  decision from admit / merge / decline / hold, the required value, evidence,
  scope, overlap, and delivery-risk assessments, plus `product_boundary` and
  `abstraction_quality`. `admit` may provide final `priority`; `merge` requires
  `into`; `decline` requires `reason`. Omitted proposals remain undecided and are
  handled by the driver as hold.

  The parameters are schema-validated at call time; invalid values (unknown
  decision, self-invented keys) are rejected and you must retry.
# Spec-0029/T6：input_schema 是 agent_contract.admission_input_schema() 的生成副本（受 drift-guard
# 测试守护：test_owner.py 断言二者深度相等）。改契约改 agent_contract 后需重生成此块。
input_schema:
  type: object
  properties:
    decisions:
      type: array
      items:
        type: object
        properties:
          issue:
            type: integer
          decision:
            type: string
            enum:
              - admit
              - merge
              - decline
              - hold
          into:
            type: integer
          priority:
            type: string
            enum:
              - P0
              - P1
              - P2
              - P3
          reason:
            type: string
          value_assessment:
            type: string
          evidence_assessment:
            type: string
          scope_assessment:
            type: string
          overlap_assessment:
            type: string
          delivery_risk:
            type: string
          product_boundary:
            type: string
            enum: [in_scope, out_of_scope, uncertain]
          abstraction_quality:
            type: string
            enum: [appropriate, too_implementation_specific, uncertain]
        required:
          - issue
          - decision
          - value_assessment
          - evidence_assessment
          - scope_assessment
          - overlap_assessment
          - delivery_risk
          - product_boundary
          - abstraction_quality
        additionalProperties: false
  required:
    - decisions
  additionalProperties: false
