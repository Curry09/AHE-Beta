type: agent
name: owner
max_context_tokens: 256000
system_prompt: ./systemprompt.md
system_prompt_type: file
# structured：使用模型原生结构化工具调用，工具参数由 NexAU 按 schema 校验。
tool_call_mode: structured
# 准入评审只读取运行时提供的结构化评审批次，并以一次 submit 完成裁决。
max_iterations: 80

middlewares:
  # 工作区 jail：owner 只能读 harness 仓，文件工具越界读一律拒——机制硬禁读 trace
  # （data/sessions 体感+会话、data/harness_runs 运行副本）。通用 jail 一并挡住仓外任何路径。
  - import: auto_designer.guards.workspace_jail:WorkspaceJailMiddleware

llm_config:
  # 分角色配置：owner 与 triage/synthesize 共用 DEMAND_LLM_*。
  model: ${env.DEMAND_LLM_MODEL}
  base_url: ${env.DEMAND_LLM_BASE_URL}
  api_key: ${env.DEMAND_LLM_API_KEY}
  max_tokens: 32768
  timeout: 300
  api_type: openai_chat_completion

# Owner 不访问源码或会话存储；sandbox 配置仅保持 agent 运行环境与其他需求面角色一致。
sandbox_config:
  type: local

tools:
  - name: submit_observation_gap
    yaml_path: ./tools/submit_observation_gap.tool.yaml
    binding: auto_designer.observations.gaps:submit_observation_gap
  # 收尾工具：input_schema = agent_contract.admission_input_schema() 的生成副本（drift-guard 守护）；
  # nexau 在调用层强校验，stop tool 的返回值（decisions JSON）成为 agent.run 的返回。
  - name: submit_admission
    yaml_path: ./tools/submit_admission.tool.yaml
    binding: auto_designer.demand.submit_tools:submit_admission

stop_tools: [submit_admission]
