type: agent
name: owner
max_context_tokens: 256000
system_prompt: ./systemprompt.md
system_prompt_type: file
# structured: use native structured model tool calls; NexAU validates tool arguments against the schema.
tool_call_mode: structured
# Admission review reads only the structured review batch supplied at runtime and decides with one submit.
max_iterations: 80

middlewares:
  # Workspace jail: owner can read only the harness repo; file tools reject all reads outside it, mechanically blocking trace access
  # (data/sessions user experience scores and sessions, data/harness_runs runtime copies). The general jail also blocks every path outside the repo.
  - import: ahe_beta.guards.workspace_jail:WorkspaceJailMiddleware

llm_config:
  # Role configuration: owner shares DEMAND_LLM_* with triage/architect.
  model: ${env.DEMAND_LLM_MODEL}
  base_url: ${env.DEMAND_LLM_BASE_URL}
  api_key: ${env.DEMAND_LLM_API_KEY}
  max_tokens: 32768
  timeout: 300
  api_type: openai_chat_completion

# Owner does not access source code or session storage; sandbox configuration keeps its runtime consistent with other demand-side roles.
sandbox_config:
  type: local

tools:
  - name: submit_observation_gap
    yaml_path: ./tools/submit_observation_gap.tool.yaml
    binding: ahe_beta.observations.gaps:submit_observation_gap
  # Final tool: input_schema is a generated copy of agent_contract.admission_input_schema() (protected by drift-guard);
  # nexau enforces validation at the call layer; the stop tool return value (decisions JSON) becomes the agent.run result.
  - name: submit_admission
    yaml_path: ./tools/submit_admission.tool.yaml
    binding: ahe_beta.demand.submit_tools:submit_admission

stop_tools: [submit_admission]
