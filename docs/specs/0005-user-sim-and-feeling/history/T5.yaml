      - 感知原样喂入：移除 perceive_filter/_filter_self_obs 后，run_session 把原始 harness 文本喂入 client，
        verify_self 注入原始观察（不再按子串伪造「崩了/没报错」）；能力分叉不依赖框架过滤而由 prompt 承载。
