# 名词表（glossary）：OVERVIEW「名词解释」段的唯一来源，手工维护。
# OVERVIEW.md 由 `spec render` 自动生成、勿手改；要改名词解释改本文件后 re-render。
# 每条：term（显示名，英文优先）、category（分组，按首次出现顺序成段）、def（一句话学术化解释）。
# 定义须有据可查——来源为 CLAUDE.md 项目设计与各组 tasks/T*.yaml 的 prose 字段。
terms:
  - term: harbor
    category: 底座与运行时
    def: rollout 底座，承载整条自进化闭环的运行。
  - term: nexau
    category: 底座与运行时
    def: agent 运行时实现，MVP 唯一接入的运行时；三角色（user/developer/test）均为「同一 nexau 运行时 + 不同 agent 定义（prompt+工具）」。
  - term: harness
    category: 底座与运行时
    def: 被进化对象，建模为「可启动程序 + 黑盒对话契约」而非单个 agent；内部 1 个或 N 个 nexau 的编排由其自带 entry 决定，源码为独立 git 仓托管于 Gitea。
  - term: benchmark
    category: 底座与运行时
    def: held-out 测试集，全程不参与训练、不进发版门禁，仅事后验证体感驱动的进化是否带来真实能力提升。

  - term: user agent
    category: 三角色（agent 定义）
    def: 扮演真实用户，按 Persona + SeedScenario 多轮使用 harness，产出体感评分（训练信号）与 issue。
  - term: developer agent
    category: 三角色（agent 定义）
    def: 从 Gitea 领取 open issue，按 label 分流到对应分支策略，用 nexau 修改 harness bundle 并提交。
  - term: test agent
    category: 三角色（agent 定义）
    def: 用候选 harness ref 跑固定集的 N 局用户会话，算平均体感与 release 基线比较，做体感回归门禁。

  - term: Persona
    category: 用户侧数据结构（spec-0001/T1）
    def: 用户画像（身份/水平/领域/目标/说话风格），蒸馏自真实数据，不依据 benchmark 或轨迹构造。
  - term: SeedScenario
    category: 用户侧数据结构（spec-0001/T1）
    def: 种子场景，一局会话的初始诉求/任务描述（给定输入，非测试用例）。
  - term: Transcript
    category: 用户侧数据结构（spec-0001/T1）
    def: 有序 (role, content) 多轮对话记录，role ∈ {user, harness}。
  - term: FeelingScore
    category: 用户侧数据结构（spec-0001/T1）
    def: 1–4 体感评分 + 理由，一局一个、会话末产出，作为训练信号。
  - term: IssueDraft
    category: 用户侧数据结构（spec-0001/T1）
    def: 用户 agent 产出的问题草稿（title/body/labels），一局 0..n 条。
  - term: IssueRef
    category: 用户侧数据结构（spec-0001/T1）
    def: issue 提交至 Gitea 后的回执（number/url/state）；本地只持回执，权威源在 Gitea。
  - term: Session
    category: 用户侧数据结构（spec-0001/T1）
    def: 一局会话的完整封装，聚合 persona/scenario/transcript/feeling/issue_refs。

  - term: HarnessInterface
    category: 接口与组件
    def: 用户侧与 harness 的黑盒多轮对话契约（send/reset/close），使用户侧不感知 harness 内部结构。
  - term: IssueTracker
    category: 接口与组件
    def: issue 提交去向的抽象接口，使用户侧不绑定具体 tracker 后端。
  - term: FakeTracker
    category: 接口与组件
    def: IssueTracker 的内存桩实现，供用户侧独立测试（不依赖真 Gitea）。
  - term: GiteaTracker
    category: 接口与组件
    def: IssueTracker 的 Gitea 真后端，一个打 Gitea /api/v1 的薄 REST 客户端。
  - term: run_session
    category: 接口与组件
    def: 用户侧唯一入口，单一无状态函数把 Persona/SeedScenario/HarnessInterface/UserAgent 编排为一局 Session。
  - term: SessionStore
    category: 接口与组件
    def: 把一局 Session 持久化到本地 data/sessions/（全量文件 + 总索引），作为体感曲线与回归基线的数据源。
  - term: launcher
    category: 接口与组件
    def: 按 git ref 取出某版 harness、启动其自带 entry、按黑盒逐轮协议适配为 HarnessInterface 的粘合层。
  - term: nexau_runtime
    category: 接口与组件
    def: 单一 nexau 适配层，把一份角色定义（prompt+工具）加载成可调用的 agent，供三角色共用。
  - term: orchestrator
    category: 接口与组件
    def: 把用户侧(a)、开发者侧(b)、回灌(c) 串成可重复进化轮次的闭环编排。
  - term: metrics
    category: 接口与组件
    def: 从 Gitea 与本地 session 统计 issue 数量随时间的曲线与体感趋势的观测组件。

  - term: Gitea
    category: 基建与流程
    def: 自托管 git 服务（docker + sqlite），issue 与 harness 仓的家；负责发号/状态/标签/comment。
  - term: release 分支
    category: 基建与流程
    def: harness 仓的稳定分支，bug 修复走此分支快速迭代；体感门禁通过的候选合入于此。
  - term: feature 分支
    category: 基建与流程
    def: harness 仓的特性分支，大 feature 在此完成后再合入 release。
  - term: tag
    category: 基建与流程
    def: harness 仓的发布版本标记，即用户侧下一轮 pin 的 harness 版本。
  - term: 体感门禁
    category: 基建与流程
    def: 唯一发版门禁，只检查体感是否回归（benchmark 不参与）；候选与 release 基线比较，不退化则放行。
  - term: distill（蒸馏模块）
    category: 基建与流程
    def: 从真实使用数据（CC/codex/nexau 日志、issue tracker、社区反馈）蒸馏出 persona 库与种子场景库。
  - term: harness_template
    category: 基建与流程
    def: v0 harness 种子（entry + agents + params），用于初始化 Gitea 上的 harness 独立仓。

  - term: harbor runner
    category: 运行时与恢复（spec-0004）
    def: orchestrator 外层的可恢复运行入口，作为一个 harbor task（方案 A，整条 run = 1 task）在单沙盒内驱动逐轮编排，每轮 save_checkpoint 并经 harbor artifact 通道吐出沙盒；逐轮真人对话仍走 spec-0001 自立协议，harbor 只包外层 rollout 生命周期。
  - term: checkpoint
    category: 运行时与恢复（spec-0004）
    def: harbor task 每轮边界吐出的自包含状态快照（STATE_DIR 的打包 artifact），供沙盒易失后恢复；是 Gitea/SessionStore 等权威源的整体快照，非第二权威。
  - term: STATE_DIR
    category: 运行时与恢复（spec-0004）
    def: 收敛全部可恢复状态的单一自包含目录（Gitea data + sessions/ + metrics.jsonl + run_state.json），checkpoint 的打包对象。
  - term: run_state
    category: 运行时与恢复（spec-0004）
    def: 编排游标（轮次/阶段/current_release_ref）与三侧中间态标记（用户侧已完成 session、开发者侧 issue 分派与候选分支、待合并/发版）；能从产物推断的优先推断，run_state 兜底。
