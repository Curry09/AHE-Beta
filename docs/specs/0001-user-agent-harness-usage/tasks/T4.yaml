summary: |-
  用户侧的最小可用入口：一个函数把 persona、场景、harness、user agent 串成一局，吐出结构化 Session。
motivation: |-
  闭环编排（loop/）和统计（metrics/）都需要一个稳定的「跑一局」入口。把组装逻辑收在 runner，
  上层只管喂输入、收 Session，不关心内部怎么对话。
scope: |-
  编排一局会话：加载 Persona+SeedScenario → 用 UserAgent 驱动 HarnessInterface → 收集 Transcript+FeelingScore+IssueDraft → 返回结构化 Session。这是 user_side 最小可用入口。
design: |-
  单一入口函数，无状态：

  ```
  run_session(persona, scenario, harness, user_agent) -> Session:
      harness.reset()
      transcript, feeling, issues = user_agent.run(scenario, harness)
      harness.close()
      return Session(persona, scenario, transcript, feeling, issues)
  ```

  依赖全部从参数注入（harness 后端、user_agent 的 llm 都由调用方给），runner 自身不 new 任何后端——
  便于测试用 Fake、便于上层换真实 nexau。Session 可序列化落盘到 data/issues 供曲线统计。
interface: |-
  run_session(persona, scenario, harness, user_agent) -> Session
tradeoffs: |-
  做成纯函数 + 依赖注入而非 SessionRunner 类：本组无需跨会话共享状态，函数最省（奥卡姆）；
  若将来要做并发/批量跑多局，再在 loop/ 层包装，不污染本入口。
acceptance: |-
  run_session(persona, scenario, harness) 端到端返回完整 Session;用 Fake 后端可跑;transcript/体感/issue 三者齐全;单测覆盖正常结束与提前放弃。
tests: |-
  集成测：用 FakeHarness + mock LLM 跑 run_session，断言 ① 返回 Session 三件套齐全；
  ② harness.reset/close 各被调一次；③ 提前放弃场景下 transcript 轮数 < max_turns 且体感分合法。
references: |-
  CLAUDE.md 用户侧(a)。下游：loop/ 编排 a→b→c、metrics/ 统计 issue 曲线。
