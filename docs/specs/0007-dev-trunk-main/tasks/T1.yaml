scope: |-
  把 dev agent 的 git 流程从「fix/issue-N 分支 + --no-ff 合 release + 打 tag + push branch/release/tag」改为直推 main：work_one 注入的流程与 systemprompt.md 文案统一为 `git checkout main → 改 agents/main.md → commit → git tag vK → git push origin main vK`，去掉 branch、merge、release 全部字样。DevOutcome.released 语义改为「committed（已推 main）」（字段名可保留或重命名，二选一在实现时定）；ground-truth 判定仍为「新 vK tag 出现」，成功即 close 该 issue（沿用 tracker.set_state）。不分 bug/feature，单 dev agent 串行领 issue 不变。不动 launcher、orchestrator。
