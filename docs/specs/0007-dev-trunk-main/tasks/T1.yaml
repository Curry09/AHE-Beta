interface: ''
tradeoffs: ''
acceptance: |-
  work_one 全程不创建 fix/issue-* 分支、不执行 --no-ff merge；实际 git 历史落在 main 上；流程产出新 vK tag 且 main 与 vK 均被 push origin；DevOutcome 表达「已 commit 到 main」语义；新 tag 出现→issue 被 close；systemprompt.md 无 branch/merge/release 字样、与注入流程一致。单测（mock nexau + 临时 git 仓 fixture）覆盖：直推 main 后仓内无新分支、有新 commit+tag；无可领 issue 返回空 DevOutcome；新 tag→close 调用。
