acceptance: |-
  在含 main(空种子)+release(领先)+孤儿 fix/issue-* 分支的 fixture 仓上运行后：main 指向旧 release tip（内容与历史全保留、git log 可见 release 历史）、release 及孤儿/已合并分支均删除、本地仅剩 main 一条线。重复运行幂等无副作用、不报错。当 release 不存在或 main 不是 release 祖先时安全跳过并打印原因，不执行 -f/删除。
