scope: |-
  新增一次性迁移脚本，把演化成果从 release 收敛到 main 且不丢东西：`git branch -f main release`（main 移到 release 当前 tip，保留全部历史与内容）→ 删除 release 分支、4 条孤儿 fix/issue-* 分支、4 条已合并分支 → push main、删除远端 release、确认 Gitea 默认分支为 main。幂等：已迁移（main 已含 release tip、无 release 分支）则 no-op、不报错。对意外仓状态（无 release、main 非 release 祖先）安全退出并提示，不强行破坏。
