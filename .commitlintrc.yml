# Conventional Commits (see the code conventions in CLAUDE.md)
# Types: feat / fix / refactor / chore / docs / test / ci / style / perf / build / spec
extends:
  - '@commitlint/config-conventional'
rules:
  # Subjects may begin with proper names such as OVERVIEW, CLAUDE.md or Gitea.
  # Disable subject-case restrictions to avoid false positives for those names.
  subject-case: [0]
  # Add spec to the conventional types for creating and revising specifications.
  type-enum:
    - 2
    - always
    - [build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test, spec]
