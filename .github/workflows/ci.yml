# CI pipeline (adapted from OpenAgents).
# Only "CI Gate" is a required status check for branch protection; the other jobs are its prerequisites.
# Adaptation: the spec CLI is vendored in this repository (tools/spec-driven-development/vendor),
# and invoked via PYTHONPATH + `python -m openagents.spec.cli` rather than `uv run spec`.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      observation_reader_commit:
        description: 'Optional full OpenAgents commit SHA overriding the pinned execution-evidence reader'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SPEC_PYTHONPATH: tools/spec-driven-development/vendor

jobs:
  nexau-pin:
    name: NexAU immutable dependency contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 backend/scripts/check_nexau_dependency.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff check + format
        run: |
          uv sync --locked --extra dev
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12.13'
      - name: Install locked dependencies
        run: uv sync --locked --extra experiments --extra dev --extra harbor-evaluation
      - name: Verify installed SDK commit
        run: uv run --locked --extra experiments --extra dev --extra harbor-evaluation python backend/scripts/check_nexau_dependency.py --installed
      - name: Standalone evaluation tests with the frozen user engine
        run: PYTHONPATH=. uv run --locked --extra experiments --extra dev --extra harbor-evaluation python -m pytest -v -c /dev/null -p no:cacheprovider --durations=20 --timeout=120 --timeout-method=thread evaluation/tests
      - name: Backend and evaluation tests
        run: uv run --locked --extra experiments --extra dev --extra harbor-evaluation pytest -v --durations=20 --timeout=120 --timeout-method=thread -o faulthandler_timeout=60
      - name: Public experiment directory contract
        run: uv run --locked --extra experiments --extra dev python backend/scripts/check_experiment_repository.py
      - name: Offline demo
        run: uv run --locked --extra experiments --extra dev python backend/scripts/offline_demo.py

  integration:
    name: OpenAgents configuration and evidence contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Spec-0084/T6: validate the reader used by new experiments, including execution evidence.
      # An override must use an immutable remote commit, never a moving branch.
      - name: Select the immutable reader
        id: reader
        env:
          CANDIDATE_READER: ${{ inputs.observation_reader_commit }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          manifest = json.loads(Path('backend/compatibility.json').read_text())
          reader = manifest['execution_evidence']
          candidate = os.environ.get('CANDIDATE_READER', '')
          ref = candidate or reader.get('reader_release_commit') or reader.get('reader_candidate_commit')
          if not isinstance(ref, str):
              raise SystemExit('Execution-evidence reader pin is required')
          if not re.fullmatch('[a-f0-9]{40}', ref):
              raise SystemExit('Reader pin must be a full commit SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ref={ref}\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: Curry09/OpenAgents
          ref: ${{ steps.reader.outputs.ref }}
          path: .ci/OpenAgents
          token: ${{ secrets.OPENAGENTS_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Match the paired SDK source
        run: uv run --locked --extra dev python backend/scripts/check_nexau_dependency.py --other-project .ci/OpenAgents --installed
      - run: uv run --locked --extra dev python backend/scripts/check_openagents_contract.py --openagents .ci/OpenAgents
      - name: Real gzip, ZIP and execution-evidence producer-reader contracts
        run: uv run --locked --extra dev python backend/scripts/check_observation_contract.py --openagents .ci/OpenAgents

  commitlint:
    name: Commit Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  spec-validate:
    name: Spec Validate & Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Validate specs
        run: |
          uv sync --locked --extra dev
          PYTHONPATH=$SPEC_PYTHONPATH .venv/bin/python -m openagents.spec.cli validate
      - name: Render & graph drift check
        run: |
          PYTHONPATH=$SPEC_PYTHONPATH .venv/bin/python -m openagents.spec.cli render
          PYTHONPATH=$SPEC_PYTHONPATH .venv/bin/python -m openagents.spec.cli graph --package-root backend/ahe_beta
          git diff --exit-code docs/specs

  spec-conflicts:
    name: Spec Number Conflicts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check spec number conflicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python backend/scripts/check-spec-number-conflicts.py \
            --open-prs \
            --current-pr "${{ github.event.pull_request.number }}"

  ci-gate:
    name: CI Gate
    if: always()
    needs: [nexau-pin, lint, test, integration, commitlint, spec-validate, spec-conflicts]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "lint:           ${{ needs.lint.result }}"
          echo "test:           ${{ needs.test.result }}"
          echo "commitlint:     ${{ needs.commitlint.result }}"
          echo "spec-validate:  ${{ needs.spec-validate.result }}"
          echo "spec-conflicts: ${{ needs.spec-conflicts.result }}"
          results=(
            "${{ needs.nexau-pin.result }}"
            "${{ needs.integration.result }}"
            "${{ needs.lint.result }}"
            "${{ needs.test.result }}"
            "${{ needs.commitlint.result }}"
            "${{ needs.spec-validate.result }}"
            "${{ needs.spec-conflicts.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::CI failed — job result: $r"
              exit 1
            fi
          done
          echo "✓ All jobs passed or were correctly skipped"
