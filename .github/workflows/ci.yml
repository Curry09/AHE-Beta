# CI 流水线（参考 OpenAgents 裁剪）。
# 仅 "CI Gate" 作为分支保护的必需状态检查；其余 job 是它的前置。
# 适配点：spec CLI 在本仓为 vendored（tools/spec-driven-development/vendor），
# 通过 PYTHONPATH + `python -m openagents.spec.cli` 调用，而非 `uv run spec`。
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      observation_reader_commit:
        description: 'Full OpenAgents commit SHA for the gzip/ZIP candidate contract'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SPEC_PYTHONPATH: tools/spec-driven-development/vendor

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff check + format
        run: |
          uv sync --locked --extra dev
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Backend and evaluation tests
        run: uv run --locked --extra dev pytest -q
      - name: Public experiment directory contract
        run: uv run --locked python backend/scripts/check_experiment_repository.py
      - name: Offline demo
        run: uv run --locked python backend/scripts/offline_demo.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend

  integration:
    name: OpenAgents configuration and evidence contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Spec-0070/T5: the published baseline stays usable while the reader PR is reviewed.
      # A candidate must use an explicit immutable remote commit, never a moving branch.
      - name: Select the immutable reader
        id: reader
        env:
          CANDIDATE_READER: ${{ inputs.observation_reader_commit }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          manifest = json.loads(Path('release/compatibility.json').read_text())
          hosted = manifest['observation_transport']['reader_release_commit']
          candidate = os.environ.get('CANDIDATE_READER', '')
          ref = candidate or hosted or manifest['openagents']['integration_commit']
          if not re.fullmatch('[a-f0-9]{40}', ref):
              raise SystemExit('Reader pin must be a full commit SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ref={ref}\n')
              output.write(f'hosted={str(bool(candidate or hosted)).lower()}\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: Curry09/OpenAgents
          ref: ${{ steps.reader.outputs.ref }}
          path: .ci/OpenAgents
          token: ${{ secrets.OPENAGENTS_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev python backend/scripts/check_openagents_contract.py --openagents .ci/OpenAgents
      - name: Real gzip and ZIP producer-reader contract
        if: steps.reader.outputs.hosted == 'true'
        run: uv run --locked --extra dev python backend/scripts/check_observation_contract.py --openagents .ci/OpenAgents
      - name: Report baseline-only coverage
        if: steps.reader.outputs.hosted != 'true'
        run: echo 'Hosted evidence release pin is pending; configuration baseline only. Run workflow_dispatch with the reader candidate SHA to validate ZIP.'

  commitlint:
    name: Commit Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  spec-validate:
    name: Spec Validate & Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Validate specs
        run: |
          uv sync --locked --extra dev
          PYTHONPATH=$SPEC_PYTHONPATH .venv/bin/python -m openagents.spec.cli validate
      - name: Render & graph drift check
        run: |
          PYTHONPATH=$SPEC_PYTHONPATH .venv/bin/python -m openagents.spec.cli render
          PYTHONPATH=$SPEC_PYTHONPATH .venv/bin/python -m openagents.spec.cli graph --package-root backend/auto_designer
          git diff --exit-code docs/specs

  spec-conflicts:
    name: Spec Number Conflicts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check spec number conflicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python backend/scripts/check-spec-number-conflicts.py \
            --open-prs \
            --current-pr "${{ github.event.pull_request.number }}"

  ci-gate:
    name: CI Gate
    if: always()
    needs: [lint, test, frontend, integration, commitlint, spec-validate, spec-conflicts]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "lint:           ${{ needs.lint.result }}"
          echo "test:           ${{ needs.test.result }}"
          echo "commitlint:     ${{ needs.commitlint.result }}"
          echo "spec-validate:  ${{ needs.spec-validate.result }}"
          echo "spec-conflicts: ${{ needs.spec-conflicts.result }}"
          results=(
            "${{ needs.frontend.result }}"
            "${{ needs.integration.result }}"
            "${{ needs.lint.result }}"
            "${{ needs.test.result }}"
            "${{ needs.commitlint.result }}"
            "${{ needs.spec-validate.result }}"
            "${{ needs.spec-conflicts.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::CI failed — job result: $r"
              exit 1
            fi
          done
          echo "✓ All jobs passed or were correctly skipped"
