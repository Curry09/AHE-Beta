# 唯一需要手动编辑的评测配置；API密钥写入.env。
version: 1
name: harbor-evaluation

paths:
  harnesses: ../harnesses
  cache: .cache
  runs: runs

# 任务源的规则由其profile解释。harbor可直接使用本地标准Harbor任务包。
task_source: harbor_index
# harbor_index: published38 / all / [题目ID, ...]
tasks: published38
# 可选：v0、u8、u8-direct、u16、u32、claude-code、meta-harness
harnesses: [v0, u32]

actor:
  model: glm-5.3-flash
  base_url: https://open.bigmodel.cn/api/paas/v4
  api_key_env: ACTOR_API_KEY
  # 选claude-code时填写兼容Anthropic协议的地址；密钥默认同上。
  anthropic_base_url: null
  reasoning_effort: max
  max_output_tokens: 65536
  stream: native
  thinking: true

user:
  enabled: true
  model: glm-5.3-flash
  # 未填地址/密钥变量时沿用actor；persona固定为原实验设定。
  reasoning_effort: max

judge:
  # 仅需要官方LLM裁判的题目使用；不更换题目规定的裁判。
  base_url: null
  api_key_env: JUDGE_API_KEY
  # 网关要求前缀时可改为anthropic/claude-opus-5，仅作为同一裁判的接口别名。
  model: claude-opus-5
  # 仅对返回usage.server_tool_use: null的兼容网关启用；须填写base_url。
  normalize_usage: false

execution:
  provider: e2b
  concurrency: 4
  repetitions: 1
  time_adaptation: false

experience:
  # 解题结束并冻结提交后统一评分，不占用官方解题预算。
  timeout_seconds: 600
