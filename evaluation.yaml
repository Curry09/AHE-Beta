# The only evaluation configuration that needs to be edited manually; write the API key to .env.
version: 1
name: harbor-evaluation

paths:
  harnesses: ../harnesses
  cache: .cache
  runs: runs

# The task source's rules are interpreted by its profile. harbor can directly use local standard Harbor task packages.
task_source: harbor_index
# harbor_index: published38 / all / [task ID, ...]
tasks: published38
# Optional: v0, u8, u8-direct, u16, u32, claude-code, meta-harness
harnesses: [v0, u32]

actor:
  model: glm-5.3-flash
  base_url: https://open.bigmodel.cn/api/paas/v4
  api_key_env: ACTOR_API_KEY
  # When claude-code is selected, enter an address compatible with the Anthropic protocol; the key defaults to the same as above.
  anthropic_base_url: null
  reasoning_effort: max
  max_output_tokens: 65536
  stream: native
  thinking: true

user:
  enabled: true
  model: glm-5.3-flash
  # When the address/API key variables are omitted, actor is used; persona is fixed to the original experiment settings.
  reasoning_effort: max

judge:
  # Only tasks requiring an official LLM judge use this; do not replace the judge specified by the task.
  base_url: null
  api_key_env: JUDGE_API_KEY
  # When the gateway requires a prefix, it can be changed to anthropic/claude-opus-5, serving only as an interface alias for the same judge.
  model: claude-opus-5
  # Enable only for compatible gateways that return usage.server_tool_use: null; base_url must be provided.
  normalize_usage: false

execution:
  provider: e2b
  concurrency: 4
  repetitions: 1
  time_adaptation: false

experience:
  # Score uniformly after the solution is complete and the submission is frozen; this does not consume the official solution budget.
  timeout_seconds: 600
