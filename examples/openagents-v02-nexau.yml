# Explicit alternative profile; backend/run.py does NOT select this flow by default.
version: 1
flow: v0.2
coordination: soft
forge: gitea
gitea:
  base_url: http://127.0.0.1:3000
  owner: demo
  repo: harness
  token_env: GITEA_TOKEN
agents:
  spec_writer: {backend: nexau}
  spec_curator: {backend: nexau}
  developer: {backend: nexau}
  acceptance: {backend: nexau}
release: manual
defaults:
  base: main
  labels: [openagents]
