# Copy to the repository root as evaluation.yaml; edit endpoints there.
version: 1
name: ahe-messages-smoke
paths:
  harnesses: ../harnesses
  cache: .cache
  runs: runs
task_source: harbor_index
tasks: [swebenchpro-fix-file-suffix-chooser]
harnesses: [ahe]
actor:
  model: glm-5.3-flash
  api_type: anthropic_chat_completion
  base_url: https://your-messages-gateway.example
  api_key_env: ACTOR_API_KEY
  reasoning_effort: max
  max_output_tokens: 65536
  stream: native
  thinking: true
user:
  enabled: true
  model: glm-5.3-flash
  base_url: https://your-openai-gateway.example/v1
  api_key_env: USER_API_KEY
  reasoning_effort: max
  max_output_tokens: 65536
judge:
  base_url: null
  api_key_env: JUDGE_API_KEY
execution:
  provider: e2b
  concurrency: 1
  repetitions: 1
  time_adaptation: false
experience:
  timeout_seconds: 600
