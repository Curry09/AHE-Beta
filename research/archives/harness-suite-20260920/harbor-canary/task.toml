# Non-scoring Harbor integration canary. This is not part of task-manifest.json.
schema_version = "1"

artifacts = ["/app/answer.txt"]

[task]
name = "hse/harbor-boyue-canary"
description = "Verify Harbor agent, Boyue model gateway, and verifier wiring."

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 180.0

[environment]
build_timeout_sec = 120.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
