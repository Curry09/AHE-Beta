[project]
name = "ahe-beta"
version = "0.0.0"
description = "自进化 harness：模拟用户→开发者闭环，体感驱动、benchmark held-out"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "nexau @ git+https://github.com/hzhua/nexau.git@28511d9f0362191a6c378fd441b2be55309a9e32",
    # NexAU at this commit still imports pre-1.0 AG-UI thinking events.
    "ag-ui-protocol==0.1.22",
    # Pinned NexAU passes httpx.Timeout; Anthropic 1.x rejects that type
    # because it uses httpx2. OpenAI 3.x still accepts the configuration.
    "anthropic<1",
    # NexAU imports SQLAlchemy's asyncio engine even without an async DB driver.
    "greenlet>=3.0.0",
    # spec CLI（vendored 在 tools/spec-driven-development/vendor）所需
    "ruamel.yaml>=0.18",
    "jsonschema>=4",
    # GiteaTracker（spec-0002）所需的薄 REST 客户端
    "requests>=2.31",
    # Signed external grading receipts (Spec-0084/T5).
    "cryptography>=44",
    # 前端观测看板的只读 HTTP 层
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
# Spec-0069/T6: both unified experiment backends and frozen SWE task materials.
experiments = [
    "pyarrow==21.0.0",
    "e2b==2.55.0",
]
harbor-evaluation = [
    "harbor[e2b,daytona]==0.24.0",
    "e2b==2.55.0",
    "daytona==0.223.0",
]
evaluation = [
    # 4.1 is the official runner compatible with the pinned Verified parquet
    # schema and prebuilt swebench/sweb.eval images used by this experiment.
    "swebench==4.1.0",
]
dev = [
    "httpx>=0.28",
    "httpx2>=1.0",
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    # drift-guard 测试解析 agent_defs 的 *.tool.yaml（对照 agent_contract 生成的 input_schema）
    "pyyaml>=6.0",
    "pytest-timeout==2.4.0",
]

# 本仓暂不作为可安装包；uv 只装依赖。
[tool.uv]
package = false

[tool.pytest.ini_options]
# 后端在 backend/（前后端分目录）：暴露 backend 让测试 import ahe_beta，
# backend/scripts 暴露以便测试 import bootstrap_harness 等脚本
pythonpath = [".", "backend", "backend/scripts"]
testpaths = ["backend/tests", "evaluation/tests"]

# Ruff lint/format（CLAUDE.md 代码检查：行宽 100）
[tool.ruff]
line-length = 100
target-version = "py312"
# 首方包根：后端在 backend/，使 import 排序把 ahe_beta / bootstrap_harness / 同目录测试模块识别为 first-party
src = ["backend", "backend/scripts", "backend/tests", "evaluation"]
# 外来代码、原始任务指令及 M04 固定配方保持发布字节，由材料哈希校验，不自动格式化。
extend-exclude = ["tools/spec-driven-development/vendor", "research/archives", "evaluation/harness/meta_artifact", "evaluation/harness/user_engine", "examples/tasks/evolution32/*/instruction.md", "examples/tasks/evolution32/M04/recipes"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle，I: import 排序，UP: pyupgrade，B: bugbear，ASYNC: 异步阻塞防护
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # 行宽由 formatter 负责
