[project]
name = "auto-designer"
version = "0.0.0"
description = "自进化 harness：模拟用户→开发者闭环，体感驱动、benchmark held-out"
requires-python = ">=3.12"
dependencies = [
    # spec CLI（vendored 在 tools/spec-driven-development/vendor）所需
    "ruamel.yaml>=0.18",
    "jsonschema>=4",
    # GiteaTracker（spec-0002）所需的薄 REST 客户端
    "requests>=2.31",
    # 前端观测看板的只读 HTTP 层
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
evaluation = [
    # 4.1 is the official runner compatible with the pinned Verified parquet
    # schema and prebuilt swebench/sweb.eval images used by this experiment.
    "swebench==4.1.0",
]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    # drift-guard 测试解析 agent_defs 的 *.tool.yaml（对照 agent_contract 生成的 input_schema）
    "pyyaml>=6.0",
]

# 本仓暂不作为可安装包；uv 只装依赖。
[tool.uv]
package = false

[tool.pytest.ini_options]
# 后端在 backend/（前后端分目录）：暴露 backend 让测试 import auto_designer，
# backend/scripts 暴露以便测试 import bootstrap_harness 等脚本
pythonpath = [".", "backend", "backend/scripts", "evaluation/public-bench-pilot"]
testpaths = ["backend/tests", "evaluation/tests", "evaluation/public-bench-pilot/tests"]

# Ruff lint/format（CLAUDE.md 代码检查：行宽 100）
[tool.ruff]
line-length = 100
target-version = "py312"
# 首方包根：后端在 backend/，使 import 排序把 auto_designer / bootstrap_harness / 同目录测试模块识别为 first-party
src = ["backend", "backend/scripts", "backend/tests", "evaluation"]
# vendored 的 spec CLI 是外来代码，不纳入本仓 lint
extend-exclude = ["tools/spec-driven-development/vendor"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle，I: import 排序，UP: pyupgrade，B: bugbear，ASYNC: 异步阻塞防护
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # 行宽由 formatter 负责
