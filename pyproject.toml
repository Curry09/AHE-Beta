[project]
name = "ahe-beta"
version = "0.0.0"
description = "Self-evolving agent harnesses driven by simulated user feedback, with independent held-out evaluation"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "nexau @ git+https://github.com/hzhua/nexau.git@28511d9f0362191a6c378fd441b2be55309a9e32",
    # NexAU at this commit still imports pre-1.0 AG-UI thinking events.
    "ag-ui-protocol==0.1.22",
    # Pinned NexAU passes httpx.Timeout; Anthropic 1.x rejects that type
    # because it uses httpx2. OpenAI 3.x still accepts the configuration.
    "anthropic<1",
    # NexAU imports SQLAlchemy's asyncio engine even without an async DB driver.
    "greenlet>=3.0.0",
    # Dependencies of the spec CLI vendored in tools/spec-driven-development/vendor.
    "ruamel.yaml>=0.18",
    "jsonschema>=4",
    # Thin REST client used by GiteaTracker (spec-0002).
    "requests>=2.31",
    # Signed external grading receipts (Spec-0084/T5).
    "cryptography>=44",
    # Read-only experiment observation API.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
# Spec-0069/T6: both unified experiment backends and frozen SWE task materials.
experiments = [
    "pyarrow==21.0.0",
    "e2b==2.55.0",
]
harbor-evaluation = [
    "harbor[e2b,daytona]==0.24.0",
    "e2b==2.55.0",
    "daytona==0.223.0",
]
evaluation = [
    # 4.1 is the official runner compatible with the pinned Verified parquet
    # schema and prebuilt swebench/sweb.eval images used by this experiment.
    "swebench==4.1.0",
]
dev = [
    "httpx>=0.28",
    "httpx2>=1.0",
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    # Drift guards parse agent_defs/*.tool.yaml against input_schema from agent_contract.
    "pyyaml>=6.0",
    "pytest-timeout==2.4.0",
]

# This repository is not installed as a package; uv installs dependencies only.
[tool.uv]
package = false

[tool.pytest.ini_options]
# Expose backend/ for ahe_beta imports and backend/scripts/ for script imports
# such as bootstrap_harness during tests.
pythonpath = [".", "backend", "backend/scripts"]
testpaths = ["backend/tests", "evaluation/tests"]

# Ruff lint/format settings (100-column convention in CLAUDE.md).
[tool.ruff]
line-length = 100
target-version = "py312"
# Treat backend packages, scripts and sibling test modules as first-party imports.
src = ["backend", "backend/scripts", "backend/tests", "evaluation"]
# Preserve published bytes of upstream code, task instructions and fixed M04 recipes;
# material hashes verify them, so automatic formatting excludes these paths.
extend-exclude = ["tools/spec-driven-development/vendor", "evaluation/harness/meta_artifact", "evaluation/harness/user_engine", "examples/tasks/evolution32/*/instruction.md", "examples/tasks/evolution32/M04/recipes"]

[tool.ruff.lint]
# E/F: pyflakes/pycodestyle; I: import sorting; UP: pyupgrade; B: bugbear;
# ASYNC: blocking-operation guards for asynchronous code.
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # The formatter handles line length.
